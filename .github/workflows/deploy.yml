name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npx vite build
        env:
          # أضِف هذا السر في: إعدادات المستودع → Secrets and variables → Actions
          # (انسخ القيمة من صفحة Keys في مشروعك على Freebuff، تبدأ بـ https://...convex.cloud)
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}

      # يسمح بفتح أي مسار مباشرة على استضافة ثابتة (يظهر التطبيق بدل صفحة 404)
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
